<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>메이플 코디 편집기</title><link rel="stylesheet" href="style.css?v=21"><header><div><h1>메이플 코디 편집기</h1></div></header><main><aside class="panel"><label>기본 동작</label><div class="btns" id="presets"></div><label>동작 선택</label><select id="action"></select><div id="starPicker" hidden><label for="throwSkill">표창 스킬</label><select id="throwSkill"><option value="lucky">럭키세븐 (2발)</option><option value="triple">트리플 스로우 (3발)</option></select><label><input type="checkbox" id="shadowPartner"> 쉐도우 파트너</label><label for="starType">표창 종류</label><select id="starType" aria-label="표창 종류"></select></div><label><input type="checkbox" id="effectsVisible" checked> 공격 / 스킬 이펙트 표시</label><hr><h2>레이어</h2><div id="layers"></div><button id="addLayer">＋ 레이어 추가</button></aside><section><div class="stage"><canvas id="canvas"></canvas><div class="bar"><button id="play">일시정지</button><button id="prev">◀ 프레임</button><button id="next">프레임 ▶</button><button id="flip">좌우 반전</button><button id="reset">위치 초기화</button><span id="state" class="tag">불러오는 중</span></div></div><div class="panel" style="margin-top:16px"><div class="toolbar" id="tools"></div><div class="tool-options" id="toolOptions"></div><div class="toolbar"><button id="undo" title="실행 취소 (Ctrl+Z)" aria-label="실행 취소"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5L3 11l6 6M3 11h11a6 6 0 0 1 6 6v3"/></svg></button><button id="redo" title="다시 실행 (Ctrl+Shift+Z / Ctrl+Y)" aria-label="다시 실행"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l6 6-6 6M21 11H10a6 6 0 0 0-6 6v3"/></svg></button></div><p class="editor-help">B 브러시 · E 지우개 · U/Shift+U 도형 · G 채우기 · M 사각 선택 · Q 올가미 · W 같은 색 · Alt 스포이드 · Ctrl+Z 취소 · Ctrl+Shift+Z / Ctrl+Y 다시 실행</p><div class="grid"><div><label>프레임 탐색</label><input id="timeline" type="range" min="0" max="1" value="0"></div><div><label>재생 속도 <span id="speedText">1×</span></label><input id="speed" type="range" min="0.1" max="2" step="0.1" value="1"></div></div><div class="stat" id="info"></div><p class="note">이동 물리는 테스트용 근사치이며, 실제 맵·충돌·스킬별 이동 로직은 아직 연결되지 않았습니다.</p></div></section><aside class="panel"><h2>전신 망토 코디</h2><label>PSD 업로드</label><input id="upload" type="file" accept=".psd,image/vnd.adobe.photoshop"><hr><div class="grid"><h2>코디 미리보기</h2><select id="previewScope"><option value="action">현재 동작</option><option value="all">전체 프레임</option></select></div><p class="mini">Aseprite에서 영역 복사 후 Ctrl+V · 선택 영역 드래그로 이동 · Ctrl+Z 실행 취소</p><div id="filePreview"></div><div class="bar" style="padding:8px 0"><span id="previewAction" style="flex:1"></span><button id="prevAction">◀</button><button id="nextAction">▶</button></div><hr><h2>색상</h2><input type="color" id="paintColor" value="#e8a5a5"><div id="colorChannels"><label>R<input id="colorR" type="number" min="0" max="255" value="232"></label><label>G<input id="colorG" type="number" min="0" max="255" value="165"></label><label>B<input id="colorB" type="number" min="0" max="255" value="165"></label><label>A<input id="colorA" type="number" min="0" max="255" value="255"></label></div><label>색상</label><canvas id="colorBoard" width="200" height="130" aria-label="색상 보드"></canvas><input id="colorHue" type="range" min="0" max="360" value="0"><label>팔레트</label><div id="palette" class="palette"></div><button id="addSwatch">현재 색 추가</button><hr><div class="btns"><button id="exportPsd">PSD 저장</button><button id="exportAse">Aseprite 저장</button><button id="exportPng">PNG 저장</button></div><p id="editorStatus" hidden role="status"></p></aside></main><footer id="pageVersion">현재 페이지 버전: v1.5.4</footer><script src="psd.js?v=21"></script><script src="app.js?v=23"></script><script src="editor.js?v=24"></script></html>
